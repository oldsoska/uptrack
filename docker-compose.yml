services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: uptrack
      POSTGRES_USER: uptrack
      POSTGRES_PASSWORD: uptrack
    ports:
      - "5433:5432" # 5432 is left for Slotly's database when both run locally
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uptrack"]
      interval: 5s
      retries: 10

  uptrack:
    build: .
    environment:
      DATABASE_URL: postgres://uptrack:uptrack@postgres:5432/uptrack?sslmode=disable
      # Local development value only; production needs a random 32+ character secret
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-dev-admin-token-change-me-0123}
      # Optional alert channels
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
